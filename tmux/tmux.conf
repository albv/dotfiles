# ── General ─────────────────────────────────────────────────────────
# Prefix: Ctrl+A (easier to reach than Ctrl+B)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g mouse on
set -g history-limit 100000
set -g escape-time 0          # no delay after Esc (matters in vim)
set -g base-index 1           # windows start at 1
setw -g pane-base-index 1
set -g renumber-windows on    # keep window numbers gapless after closing
set -g set-clipboard on       # copy to macOS clipboard via OSC 52

# The server outlives its last session. Two reasons: session-closed hooks can
# then always run their save (a server that exits at zero sessions takes the
# save job down with it), and an empty server is a truthful state — the
# snapshot becomes empty rather than stale.
set -g exit-empty off

# WezTerm tab titles show the session (project) name
set -g set-titles on
set -g set-titles-string '#S'

# True color (WezTerm supports RGB). Indexed assignment instead of -a
# append: idempotent across config reloads (no duplicate entries)
set -g default-terminal "tmux-256color"
set -s terminal-features[100] "xterm-256color:RGB"

# Forward modified keys (Shift+Enter, Ctrl+Enter, …) through to apps like
# Claude Code. tmux is a terminal-in-the-middle: it decodes each keystroke and
# re-encodes it for the inner app, and legacy encoding has no distinct sequence
# for Shift+Enter — so without this it collapses to a bare Enter. `extended-keys
# on` forwards the modern CSI-u encoding when the app requests it; `extkeys`
# advertises that the outer terminal (WezTerm) can carry it. (Indexed [101] for
# the same reload-idempotency as the RGB line above.)
set -s extended-keys on
set -s terminal-features[101] "xterm-256color:extkeys"

# ── Keybindings ─────────────────────────────────────────────────────
# Intuitive splits, opening in the current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
bind c new-window -c "#{pane_current_path}"

# Vim-style pane navigation (bind l shadows the default last-window,
# so that moves to Tab)
bind Tab last-window
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing (repeatable: hold prefix, tap key)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Reload config with prefix+r
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# Vi copy mode: prefix+[ to enter, v to select, y to yank
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Window names: show the pane's directory (project context) instead of
# the process name (agents/REPLs often report an unhelpful bare name)
setw -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}'

# ── Bell notifications (silent) ─────────────────────────────────────
# An agent (or any program) rings the bell when it finishes / needs
# attention. Flag the window in the status bar and pass the bell to WezTerm
# (which shows a silent toast) — no audio anywhere.
set -g monitor-bell on
set -g bell-action any
set -g visual-bell off
setw -g window-status-bell-style 'fg=#eb6f92,bg=#232136,bold'

# ── rose-pine-moon styling ──────────────────────────────────────────
# Pane borders: same subtle color whether active or not (no gold highlight)
set -g pane-border-style 'fg=#393552'
set -g pane-active-border-style 'fg=#393552'

# Dim inactive panes: clearly darker ground + muted default text.
# Only affects default-colored cells — apps with their own colors keep them.
setw -g window-style 'fg=#817c9c,bg=#1d1b2e'
setw -g window-active-style 'fg=#e0def4,bg=#232136'

# Status bar
set -g status-position bottom
set -g status-style 'bg=#232136,fg=#e0def4'
# No session name (the WezTerm tab title already shows the project);
# just the prefix indicator when Ctrl+A is registered
set -g status-left '#{?client_prefix,#[fg=#232136]#[bg=#c4a7e7] ^A #[default] ,}'
set -g status-left-length 10
set -g status-right ''
# Window list only when there is something to choose between (>1 windows)
setw -g window-status-format '#{?#{>:#{session_windows},1},#[fg=#6e6a86] #I:#W ,}'
setw -g window-status-current-format '#{?#{>:#{session_windows},1},#[fg=#908caa] #I:#W ,}'

# Messages and copy-mode highlight
set -g message-style 'bg=#393552,fg=#e0def4'
setw -g mode-style 'bg=#44415a,fg=#e0def4'

# ── Snapshot triggers ───────────────────────────────────────────────
# Event-driven saves: every structural change (and every tab detach, for
# scrollback freshness) funnels through ONE debounced, serialized writer —
# bin/tmux-snapshot. Replaces continuum's 15-minute timer (interval 0 below):
# single writer means no racing saves, and a `wt done` right before a reboot
# is captured immediately instead of being up to 15 minutes stale.
set-hook -g session-created 'run-shell -b "$HOME/.local/bin/tmux-snapshot"'
set-hook -g session-closed  'run-shell -b "$HOME/.local/bin/tmux-snapshot"'
set-hook -g client-detached 'run-shell -b "$HOME/.local/bin/tmux-snapshot"'

# ── Plugins (TPM) ───────────────────────────────────────────────────
# tmux-resurrect: save/restore sessions across reboots
#   save:    prefix + Ctrl-s   (manual; automatic saves are hook-driven above)
#   restore: prefix + Ctrl-r   (manual; continuum auto-restores at server start)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-capture-pane-contents 'on'
# Restore agent panes verbatim — resurrect replays each pane's saved command
# as-is (no rewrite), so whatever the worktree's .session-setup launched (e.g.
# `claude … -c`, which continues that dir's conversation) comes back the same.
# Just an allowlist of process names; add more agents by listing them, e.g.
# '"~claude" "~aider"'.
set -g @resurrect-processes '"~claude"'

# tmux-continuum: kept ONLY for its restore-at-server-start automation. Its
# autosave timer is disabled (interval 0) — saving is hook-driven through
# bin/tmux-snapshot (see Snapshot triggers above), which is the single writer.
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-save-interval '0'
# Auto-restore the last snapshot whenever the tmux server first starts (the
# ONLY trigger — a config reload won't). Removes the manual prefix+Ctrl-r.
set -g @continuum-restore 'on'
# Start-at-login is handled OUTSIDE continuum: its macOS @continuum-boot opens
# Apple Terminal.app (wrong for a WezTerm-only setup). Instead a headless
# LaunchAgent (macos/dev.dotfiles.tmux-boot.plist → bin/tmux-boot) starts the
# tmux server at login; that fresh start trips @continuum-restore above, and
# WezTerm's gui-startup then rebuilds one tab per restored session. Keep this
# 'off' so continuum doesn't fight the custom agent by reinstalling its own.
set -g @continuum-boot 'off'

# Keep this line last
run '~/.tmux/plugins/tpm/tpm'
